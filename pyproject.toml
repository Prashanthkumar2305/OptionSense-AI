[project]
name = "optionsense-ai"
version = "0.1.0"
description = "AI-powered quantitative research platform for the Indian stock market"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
    { name = "Prashanthkumar K" }
]

dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.setuptools]
packages = []

# configure ruff

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]


# configure black

[tool.black]
line-length = 88
target-version = ["py311"]

# configure mypy

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

# configure pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"